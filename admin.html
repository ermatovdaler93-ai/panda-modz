<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1210"><title>Panda Modz · Admin</title>
<style>
:root{color-scheme:dark;--bg:#090e0c;--card:#121b16;--ink:#eff8f1;--muted:#91a399;--line:#26372c;--green:#39d982;--red:#ff6262;--yellow:#e8b339}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial}.wrap{max-width:850px;margin:auto}header{display:flex;align-items:center;gap:12px;margin:8px 0 18px}header svg{width:45px}h1{font-size:22px;margin:0}h1 span{color:var(--green)}.sub,.note,.meta{color:var(--muted);font-size:12px}.card,.stat,.key{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px}h2{font-size:15px;margin:0 0 13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}.stat{text-align:center;padding:12px 5px;margin:0}.stat b{display:block;color:var(--green);font-size:22px}.stat small{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}input,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0b120e;color:var(--ink);font:inherit}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:#06150c;font-weight:800;cursor:pointer}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.red{background:transparent;border:1px solid var(--red);color:var(--red)}.btn.sm{padding:7px 10px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.key code{font-weight:800;letter-spacing:1px;word-break:break-all}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:7px 0 10px}.tag{padding:3px 8px;border-radius:20px;background:#ffffff16}.tag.active{color:var(--green)}.tag.revoked,.tag.expired{color:var(--red)}.new{white-space:pre-wrap;word-break:break-all;background:#07100b;padding:12px;border-radius:10px;margin-top:12px}.msg{font-size:13px;min-height:18px;margin-top:9px;color:var(--muted)}#login{max-width:430px;margin:12vh auto}.hidden{display:none!important}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><svg viewBox="0 0 100 100"><circle cx="22" cy="24" r="14" fill="#080d0a"/><circle cx="78" cy="24" r="14" fill="#080d0a"/><circle cx="50" cy="55" r="38" fill="#fff" stroke="#080d0a" stroke-width="3"/><ellipse cx="34" cy="50" rx="10" ry="13" fill="#080d0a"/><ellipse cx="66" cy="50" rx="10" ry="13" fill="#080d0a"/><circle cx="35" cy="49" r="3.5" fill="#fff"/><circle cx="65" cy="49" r="3.5" fill="#fff"/></svg><div><h1>Panda <span>Modz</span> · Admin</h1><div class="sub">Управление ключами активации</div></div></header>
<section id="login" class="card"><h2>Вход администратора</h2><label>Пароль администратора</label><input id="password" type="password" autocomplete="current-password"><div class="row"><button class="btn" id="loginBtn">Войти</button></div><div id="loginMsg" class="msg"></div></section>
<div id="app" class="hidden">
<div class="stats"><div class="stat"><b id="sAll">0</b><small>Всего</small></div><div class="stat"><b id="sFree">0</b><small>Свободно</small></div><div class="stat"><b id="sAct">0</b><small>Активно</small></div><div class="stat"><b id="sBad">0</b><small>Отозв./истёк</small></div></div>
<section class="card"><h2>Новые ключи</h2><div class="grid"><div><label>Количество (1–50)</label><input id="cnt" type="number" min="1" max="50" value="1"></div><div><label>Срок действия</label><select id="days"><option value="1">1 день</option><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option><option value="365">365 дней</option><option value="0">Навсегда</option></select></div><div><label>Лимит устройств</label><input id="dev" type="number" min="1" max="99" value="1"></div><div><label>Заметка</label><input id="nt" maxlength="60" placeholder="необязательно"></div></div><div class="row"><button class="btn" id="gen">Сгенерировать</button></div><div id="newBox" class="hidden"><div id="newKeys" class="new"></div><div class="row"><button class="btn ghost sm" id="cpAll">Копировать все</button></div></div><div id="msg" class="msg"></div></section>
<section class="card"><h2>Проверить ключ</h2><div class="row"><input id="chk" placeholder="XXXX-XXXX-XXXX-XXXX" style="flex:1;min-width:180px"><button class="btn" id="chkBtn">Проверить</button></div><div id="chkMsg" class="msg"></div></section>
<section class="card"><h2>Все ключи</h2><div class="row"><input id="q" placeholder="Поиск по ключу или заметке" style="flex:1;min-width:160px"><select id="flt" style="width:auto"><option value="all">Все</option><option value="free">Свободные</option><option value="active">Активные</option><option value="bad">Отозванные/истёкшие</option></select><button class="btn ghost sm" id="csv">CSV</button><button class="btn ghost sm" id="logout">Выйти</button></div><div id="list"></div></section><p class="note">Ключ начинает отсчитывать срок с первой успешной активации.</p></div></div>
<script>
const $=s=>document.querySelector(s);let token=sessionStorage.getItem("pm-admin-token")||"",rows=[];
async function api(url,opts={}){opts.headers={...(opts.headers||{}),"Content-Type":"application/json","X-Admin-Token":token};let r=await fetch(url,opts);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"Ошибка "+r.status);return d}
function state(k){if(k.revoked)return"revoked";if(k.activatedAt&&k.days>0&&Date.now()>k.activatedAt+k.days*86400000)return"expired";return k.activatedAt?"active":"free"}
function label(s){return{free:"Свободен",active:"Активен",revoked:"Отозван",expired:"Истёк"}[s]}
function say(el,t,bad=false){el.textContent=t;el.style.color=bad?"var(--red)":"var(--green)"}
async function load(){rows=await api("/api/admin/keys");render()}
async function enter(){token=$("#password").value;try{await load();sessionStorage.setItem("pm-admin-token",token);$("#login").classList.add("hidden");$("#app").classList.remove("hidden")}catch(e){token="";say($("#loginMsg"),e.message,true)}}
$("#loginBtn").onclick=enter;$("#password").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
function render(){let n={free:0,active:0,bad:0};rows.forEach(k=>{let s=state(k);if(s==="free")n.free++;else if(s==="active")n.active++;else n.bad++});$("#sAll").textContent=rows.length;$("#sFree").textContent=n.free;$("#sAct").textContent=n.active;$("#sBad").textContent=n.bad;
let q=$("#q").value.toLowerCase().trim(),f=$("#flt").value;let filtered=rows.filter(k=>{let s=state(k);return(f==="all"||(f==="bad"?(s==="revoked"||s==="expired"):s===f))&&(!q||k.key.toLowerCase().includes(q)||(k.note||"").toLowerCase().includes(q))});
$("#list").replaceChildren();if(!filtered.length){$("#list").innerHTML='<p class="note">Ключей пока нет.</p>';return}
filtered.forEach(k=>{let s=state(k),el=document.createElement("div");el.className="key";let code=document.createElement("code");code.textContent=k.key;el.append(code);let meta=document.createElement("div");meta.className="meta";meta.textContent=label(s)+" · "+(k.days? k.days+" дн.":"Навсегда")+" · устройств: "+(k.deviceIds||[]).length+"/"+k.devices+" · создан: "+new Date(k.created).toLocaleDateString("ru-RU")+(k.note?" · "+k.note:"");el.append(meta);
let actions=document.createElement("div");actions.className="row";const add=(txt,cls,fn)=>{let b=document.createElement("button");b.className="btn sm "+cls;b.textContent=txt;b.onclick=fn;actions.append(b)};
add("Копировать","ghost",async()=>{await navigator.clipboard.writeText(k.key)});if(!k.activatedAt&&!k.revoked)add("Активировать","ghost",async()=>{await api("/api/admin/keys/"+encodeURIComponent(k.key),{method:"PATCH",body:JSON.stringify({activate:true})});await load()});add(k.revoked?"Восстановить":"Отозвать","ghost",async()=>{await api("/api/admin/keys/"+encodeURIComponent(k.key),{method:"PATCH",body:JSON.stringify({revoked:!k.revoked})});await load()});add("Удалить","red",async()=>{if(confirm("Удалить ключ "+k.key+"?")){await api("/api/admin/keys/"+encodeURIComponent(k.key),{method:"DELETE"});await load()}});el.append(actions);$("#list").append(el)})}
$("#gen").onclick=async()=>{try{let d=await api("/api/admin/keys",{method:"POST",body:JSON.stringify({count:+$("#cnt").value,days:+$("#days").value,devices:+$("#dev").value,note:$("#nt").value})});$("#newKeys").textContent=d.keys.map(k=>k.key).join("\n");$("#newBox").classList.remove("hidden");say($("#msg"),"Создано: "+d.keys.length);await load()}catch(e){say($("#msg"),e.message,true)}};
$("#cpAll").onclick=()=>navigator.clipboard.writeText($("#newKeys").textContent);$("#q").oninput=render;$("#flt").onchange=render;
$("#chkBtn").onclick=()=>{let k=rows.find(x=>x.key===$("#chk").value.trim().toUpperCase());say($("#chkMsg"),k?label(state(k))+" · "+(k.days?k.days+" дн.":"навсегда")+" · устройств: "+(k.deviceIds||[]).length+"/"+k.devices:"Ключ не найден",!k)};
$("#csv").onclick=()=>{let lines=[["key","days","devices","usedDevices","status","note","created"],...rows.map(k=>[k.key,k.days,k.devices,(k.deviceIds||[]).length,label(state(k)),k.note||"",new Date(k.created).toISOString()])];let csv=lines.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="panda-keys.csv";a.click();URL.revokeObjectURL(a.href)};
$("#logout").onclick=()=>{sessionStorage.removeItem("pm-admin-token");token="";location.reload()};
if(token){$("#password").value=token;enter()}
</script></body></html>
